name: Scheduled pipeline

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily (mirrors the production Airflow DAG)
  workflow_dispatch: {}    # allow manual runs

jobs:
  nightly-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline (ingest -> build -> quality gate -> ML)
        run: python orchestration/run_pipeline.py

      - name: Upload model metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: ml/artifacts/metrics.json
          if-no-files-found: ignore
